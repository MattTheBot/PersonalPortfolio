<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text" data-i18n="nav.logo"></span>
      <span class="logo-bracket">/&gt;</span>
    </a>
    <ul class="nav-menu" id="nav-menu">
      <li><a href="index.html" class="nav-link" data-i18n="nav.home"></a></li>
      <li><a href="skills.html" class="nav-link" data-i18n="nav.skills"></a></li>
      <li><a href="portfolio.html" class="nav-link" data-i18n="nav.portfolio"></a></li>
      <li><a href="contact.html" class="nav-link active" data-i18n="nav.contact"></a></li>
      <li class="nav-cta"><a href="contact.html" class="nav-link cta-link" data-i18n="nav.hire"></a></li>
    </ul>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="it">IT</button>
      <button class="lang-btn" data-lang="de">DE</button>
    </div>
    <div class="nav-toggle" id="nav-toggle" role="button" tabindex="0" aria-label="Menu">
      <span class="toggle-bar"></span><span class="toggle-bar"></span><span class="toggle-bar"></span>
    </div>
  </div>
</nav>

<header class="page-header">
  <div class="section-container">
    <p class="section-tag" data-i18n="contact.tag"></p>
    <h1 class="page-title"><span data-i18n="contact.title"></span><span class="cursor-blink">_</span></h1>
    <p class="page-subtitle" data-i18n="contact.subtitle"></p>
  </div>
</header>

<section class="contact-section">
  <div class="section-container contact-flex">
    <div class="contact-info">
      <h2 data-i18n="contact.infoTitle"></h2>
      <p data-i18n="contact.infoSubtitle"></p>
      <div class="contact-details" id="contact-details"></div>
      <div class="social-links">
        <a href="#" class="social-link">GitHub</a>
        <a href="#" class="social-link">LinkedIn</a>
        <a href="#" class="social-link">Twitter</a>
      </div>
    </div>
    <div class="contact-form-container">
      <form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="4d2bb78f-a3fa-4313-9913-e1c6d6ae6f00">
  <input type="text" name="name" required>
  <input type="email" name="email" required>
  <textarea name="message" required></textarea>
  <button type="submit">Submit</button>
</form>
    </div>
  </div>
</section>

<section class="cta-banner">
  <div class="section-container">
    <div class="cta-content">
      <h2><span data-i18n="contact.preferEmail"></span> <span class="cta-highlight" data-i18n="contact.footerEmail"></span></h2>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-top">
      <div class="footer-brand">
        <a href="index.html" class="nav-logo footer-logo">
          <span class="logo-bracket">&lt;</span>
          <span class="logo-text" data-i18n="nav.logo"></span>
          <span class="logo-bracket">/&gt;</span>
        </a>
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-links">
        <h4 data-i18n="footer.navTitle"></h4>
        <a href="index.html" data-i18n="nav.home"></a>
        <a href="skills.html" data-i18n="nav.skills"></a>
        <a href="portfolio.html" data-i18n="nav.portfolio"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
      </div>
      <div class="footer-links">
        <h4 data-i18n="footer.connectTitle"></h4>
        <a href="#">GitHub</a><a href="#">LinkedIn</a><a href="#">Twitter</a>
        <a href="#" data-i18n="contact.email"></a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 <span data-i18n="home.title"></span>. <span data-i18n="footer.rights"></span></p>
      <p class="footer-quote" data-i18n="footer.quote"></p>
    </div>
  </div>
</footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
